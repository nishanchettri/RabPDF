name: Test and build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build RabPDF.exe
        run: pyinstaller --noconfirm --clean RabPDF.spec

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: RabPDF-Windows
          path: dist/RabPDF.exe
          if-no-files-found: error
