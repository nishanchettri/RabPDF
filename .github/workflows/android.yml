name: Android preview
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'src/rabpdf.py', 'assets/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'src/rabpdf.py', 'assets/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
          run_install: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: python -m pip install Pillow
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:engine
      - run: pnpm test && node tests/engine-smoke.mjs
      - run: pnpm build && pnpm exec cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew testDebugUnitTest assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RabPDF-Android-preview
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
      # CI bundles are unsigned. Private upload keys must never be committed.
